[main]
include=~/.local/state/void/current/theme/foot.ini
term=xterm-256color
font=JetBrainsMono Nerd Font:size=11
pad=14x14
initial-window-mode=windowed
dpi-aware=yes
workers=0

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=block
blink=no

[tweak]
font-monospace-warn=no

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste

[text-bindings]
\x1b[13;2u=Shift+Return
\x1b[13;4u=Mod1+Shift+Return
