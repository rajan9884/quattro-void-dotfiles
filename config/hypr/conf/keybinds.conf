# ==============================================================================
# AUTHENTIC QUATTRO KEYBINDINGS (100% Quickshell IPC + TUI Shortcuts)
# Zero Rofi — all menus, panels, overlays, OSD, and lock screen are driven by
# `~/.local/bin/qshell-ctl` communicating with the running Quickshell process!
# ==============================================================================

$mainMod = SUPER
$term = ~/.local/bin/launch-term
$tuiFloat = ~/.local/bin/launch-tui-float
$tuiPopup = ~/.local/bin/launch-tui-popup
$qs = ~/.local/bin/qshell-ctl

# --- Core Terminals & TUI Applications ---
bind = $mainMod, Return, exec, $term
bind = $mainMod, E, exec, $tuiFloat yazi
bind = $mainMod, B, exec, $tuiFloat btop
bind = $mainMod, G, exec, $tuiFloat lazygit

# --- Quickshell Unified Menu, App Launcher, Clipboard & Overlays ---
bind = $mainMod, Space, exec, $qs toggle menu
bind = $mainMod ALT, Space, exec, $qs toggle apps
bind = $mainMod CTRL, V, exec, $qs toggle clipboard
bind = $mainMod, period, exec, $qs toggle clipboard
bind = $mainMod, K, exec, $qs toggle keybinds
bind = $mainMod SHIFT ALT, comma, exec, $qs toggle notifications
bind = $mainMod, Escape, exec, $qs toggle power
bind = $mainMod CTRL, L, exec, $qs lock
bind = $mainMod, L, exec, $qs lock
bind = $mainMod SHIFT, R, exec, ~/.local/bin/reload-desktop

# --- Quickshell Native Hardware Control Panels (Quattro Hotkeys) ---
bind = $mainMod CTRL, A, exec, $qs toggle audio
bind = $mainMod CTRL, B, exec, $qs toggle bluetooth
bind = $mainMod CTRL, W, exec, $qs toggle network
bind = $mainMod CTRL, N, exec, $qs toggle network
bind = $mainMod CTRL, D, exec, $qs toggle monitor
bind = $mainMod CTRL, P, exec, $qs toggle power
bind = $mainMod CTRL, T, exec, $qs toggle themes

# --- Direct TUI Hardware Overrides (Super + Alt + Key) ---
bind = $mainMod ALT, A, exec, ~/.local/bin/tui-audio
bind = $mainMod ALT, N, exec, ~/.local/bin/tui-wifi
bind = $mainMod ALT, B, exec, ~/.local/bin/tui-bluetooth
bind = $mainMod ALT, X, exec, ~/.local/bin/tui-xbps

# --- Window Management ---
bind = $mainMod, W, killactive,
bind = $mainMod, Q, killactive,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, Space, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, layoutmsg, togglesplit,

# --- Focus Navigation ---
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, h, movefocus, l
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u
bind = $mainMod, l, movefocus, r

# --- Move Windows ---
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, j, movewindow, d
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, l, movewindow, r

# --- Resize Windows ---
binde = $mainMod CTRL, left, resizeactive, -40 0
binde = $mainMod CTRL, right, resizeactive, 40 0
binde = $mainMod CTRL, up, resizeactive, 0 -40
binde = $mainMod CTRL, down, resizeactive, 0 40

# --- Workspaces (1..9) ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# --- Scratchpad Workspace ---
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# --- Mouse Workspace & Window Bindings ---
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- Screenshots & Color Picker ---
bind = , Print, exec, ~/.local/bin/screenshot region
bind = SHIFT, Print, exec, ~/.local/bin/screenshot full
bind = $mainMod SHIFT, P, exec, ~/.local/bin/screenshot region
bind = $mainMod SHIFT, C, exec, hyprpicker -a

# --- Hardware Keys with Quickshell Native OSD ---
bindel = , XF86AudioRaiseVolume, exec, $qs osd volume-up
bindel = , XF86AudioLowerVolume, exec, $qs osd volume-down
bindl  = , XF86AudioMute, exec, $qs osd volume-mute
bindl  = , XF86AudioMicMute, exec, $qs osd mic-mute
bindel = , XF86MonBrightnessUp, exec, $qs osd brightness-up
bindel = , XF86MonBrightnessDown, exec, $qs osd brightness-down
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous
