# Hyprland 0.53-0.56+ compliant input config
input {
    kb_layout = us
    kb_options = compose:caps,grp:shifts_toggle
    repeat_rate = 40
    repeat_delay = 600
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
        clickfinger_behavior = true
        scroll_factor = 0.4
    }
}

gesture = 3, horizontal, workspace
