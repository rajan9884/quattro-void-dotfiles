# Hyprland 0.53-0.57+ compliant input config
input {
    kb_layout = us
    kb_options = compose:caps,grp:shifts_toggle
    repeat_rate = 40
    repeat_delay = 600
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
        clickfinger_behavior = true
        scroll_factor = 0.4
    }
}

gestures {
    workspace_swipe_distance = 300
    workspace_swipe_invert = true
    workspace_swipe_min_speed_to_force = 30
    workspace_swipe_cancel_ratio = 0.5
    workspace_swipe_create_new = true
    workspace_swipe_direction_lock = true
}

# 3-finger horizontal swipe between workspaces
gesture = 3, horizontal, workspace
# 3-finger vertical swipe toggles scratchpad
gesture = 3, up, togglespecialworkspace, scratchpad
gesture = 3, down, togglespecialworkspace, scratchpad
# 4-finger gestures for fullscreen and floating toggle
gesture = 4, up, fullscreen, 1
gesture = 4, down, togglefloating
