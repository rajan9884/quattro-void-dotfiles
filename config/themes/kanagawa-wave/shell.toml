# Quattro Shell Surface & Structural Tokens (Kanagawa Wave)
[font]
base-size = 12
heading = 16
display = 24
display-large = 28

[spacing]
scale = 1.0
scale-with-font = true
panel-padding = 18
popup-padding = 14
row-gap = 8

[bar]
scale-with-font = true
size-horizontal = 26
size-vertical = 28
icon-size = 13
icon-canvas = 16

[controls]
normal-color = "#dcd7ba"
normal-border = "#2d4f67"
normal-border-width = 1
normal-border-alpha = 0.4
hover-cursor-color = "accent"
focus-color = "accent"
selected-color = "foreground"
focus-border = "rgba(7e9cd8ee) rgba(957fb8ee) 45deg"
selected-border-width = 0

[popups]
background = "#16161d"
border = "#7e9cd8"
border-width = 2

[menu]
background = "#1f1f28"
border = "rgba(7e9cd8ee) rgba(957fb8ee) 45deg"
border-width = 2
selected-border = "accent"
selected-border-width = "1 1 1 4"

[notifications]
background = "#16161d"
border = "#7e9cd8"
border-width = 2
border-width-left = 6

[lock]
background = "#0d0c12"
text = "#ebe7c5"
placeholder = "#727169"
border-active = "rgba(7e9cd8ee) rgba(957fb8ee) 45deg"
