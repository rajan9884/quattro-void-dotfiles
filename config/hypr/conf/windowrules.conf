# ==============================================================================
# HYPRLAND 0.53+ STRICT-TYPED WINDOW RULES (Zero deprecated windowrulev2!)
# Uses `windowrule = <effect> <value>, match:<field> <regex>`
# ==============================================================================

windowrule = float 1, match:class ^(tui-float)$
windowrule = center 1, match:class ^(tui-float)$
windowrule = size 940 620, match:class ^(tui-float)$

windowrule = float 1, match:class ^(tui-popup)$
windowrule = center 1, match:class ^(tui-popup)$
windowrule = size 760 520, match:class ^(tui-popup)$

windowrule = float 1, match:title ^(Picture-in-Picture)$
windowrule = pin 1, match:title ^(Picture-in-Picture)$
windowrule = size 480 270, match:title ^(Picture-in-Picture)$
