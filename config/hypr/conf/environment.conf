# ==============================================================================
# WAYLAND & VOID LINUX ENVIRONMENT VARIABLES FOR USER: rajan
# ==============================================================================

env = USER,rajan
env = HOME,/home/rajan
env = PATH,/home/rajan/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin

# Wayland Session & Toolkits
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = GDK_BACKEND,wayland,x11,*
env = GDK_SCALE,1
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = MOZ_ENABLE_WAYLAND,1

# Cursor & Font
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Adwaita

# Default Terminal, Editor & File Manager TUIs
env = TERMINAL,foot
env = EDITOR,nvim
env = VISUAL,nvim
env = FILEMANAGER,yazi
