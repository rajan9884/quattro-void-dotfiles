# ==============================================================================
# HYPRLAND 0.53+ STRICT-TYPED WINDOW RULES
# ==============================================================================

# Media viewers & players (imv, mpv) - Centered small floating windows, opaque
windowrule = float 1, match:class ^(imv|mpv)$
windowrule = center 1, match:class ^(imv|mpv)$
windowrule = size 875 600, match:class ^(imv|mpv)$
windowrule = opaque 1, match:class ^(imv|mpv)$

# Floating utilities, installer, remover & presentation terminals
windowrule = float 1, match:class ^(org\.(void|omarchy)\..*|TUI\.float|tui-float|tui-popup)$
windowrule = center 1, match:class ^(org\.(void|omarchy)\..*|TUI\.float|tui-float|tui-popup)$
windowrule = size 875 600, match:class ^(org\.(void|omarchy)\.(terminal|bash|btop|about)|TUI\.float|tui-float)$
windowrule = size 760 520, match:class ^(tui-popup)$

# Windows titled Omarchy / Void / About
windowrule = float 1, match:title ^(Omarchy|Void|About)$
windowrule = center 1, match:title ^(Omarchy|Void|About)$
windowrule = size 875 600, match:title ^(Omarchy|Void|About)$

# Dialogs & File Pickers
windowrule = float 1, match:class ^(xdg-desktop-portal-gtk)$
windowrule = center 1, match:class ^(xdg-desktop-portal-gtk)$

# Picture in picture
windowrule = float 1, match:title ^(Picture-in-Picture)$
windowrule = pin 1, match:title ^(Picture-in-Picture)$
windowrule = size 480 270, match:title ^(Picture-in-Picture)$
