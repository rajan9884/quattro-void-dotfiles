# Quattro Shell Surface & Structural Tokens (Catppuccin Mocha)
[font]
base-size = 12
heading = 16
display = 24
display-large = 28

[spacing]
scale = 1.0
scale-with-font = true
panel-padding = 18
popup-padding = 14
row-gap = 8

[bar]
scale-with-font = true
size-horizontal = 26
size-vertical = 28
icon-size = 13
icon-canvas = 16

[controls]
normal-color = "#cdd6f4"
normal-border = "#313244"
normal-border-width = 1
normal-border-alpha = 0.4
hover-cursor-color = "accent"
focus-color = "accent"
selected-color = "foreground"
focus-border = "rgba(89b4faee) rgba(cba6f7ee) 45deg"
selected-border-width = 0

[popups]
background = "#181825"
border = "#89b4fa"
border-width = 2

[menu]
background = "#1e1e2e"
border = "rgba(89b4faee) rgba(cba6f7ee) 45deg"
border-width = 2
selected-border = "accent"
selected-border-width = "1 1 1 4"

[notifications]
background = "#181825"
border = "#89b4fa"
border-width = 2
border-width-left = 6

[lock]
background = "#11111b"
text = "#f5e0dc"
placeholder = "#6c7086"
border-active = "rgba(89b4faee) rgba(cba6f7ee) 45deg"
