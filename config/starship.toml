add_newline = true
command_timeout = 1000
format = "$directory$git_branch$git_status$cmd_duration$line_break$character"

[character]
success_symbol = "[❯](bold #7aa2f7)"
error_symbol = "[❯](bold #f7768e)"
vimcmd_symbol = "[❮](bold #bb9af7)"

[directory]
style = "bold #7dcfff"
truncation_length = 4
truncate_to_repo = true

[git_branch]
symbol = "󰊢 "
style = "bold #bb9af7"

[git_status]
style = "bold #e0af68"
