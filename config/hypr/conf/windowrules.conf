# ==============================================================================
# FLOATING TUI SCRATCHPADS & QUICKSHELL LAYER RULES
# ==============================================================================

# Centered Floating TUI Windows (yazi, btop, lazygit, calcurse, wiremix, impala, bluetuith)
windowrule = float on, match:class ^(tui-float)$
windowrule = center on, match:class ^(tui-float)$
windowrule = size 940 620, match:class ^(tui-float)$
windowrule = dim_around on, match:class ^(tui-float)$
windowrule = stay_focused on, match:class ^(tui-float)$

windowrule = float on, match:class ^(tui-popup)$
windowrule = center on, match:class ^(tui-popup)$
windowrule = size 760 520, match:class ^(tui-popup)$
windowrule = dim_around on, match:class ^(tui-popup)$

# Picture-in-Picture
windowrule = float on, match:title ^(Picture-in-Picture)$
windowrule = pin on, match:title ^(Picture-in-Picture)$
windowrule = size 480 270, match:title ^(Picture-in-Picture)$
windowrule = move 100%-500 100%-300, match:title ^(Picture-in-Picture)$

# Quickshell Layer Blur
layerrule = blur on, match:namespace quickshell
