# Quattro Shell Surface & Structural Tokens (Gruvbox Material)
[font]
base-size = 12
heading = 16
display = 24
display-large = 28

[spacing]
scale = 1.0
scale-with-font = true
panel-padding = 18
popup-padding = 14
row-gap = 8

[bar]
scale-with-font = true
size-horizontal = 26
size-vertical = 28
icon-size = 13
icon-canvas = 16

[controls]
normal-color = "#d4be98"
normal-border = "#3c3836"
normal-border-width = 1
normal-border-alpha = 0.4
hover-cursor-color = "accent"
focus-color = "accent"
selected-color = "foreground"
focus-border = "rgba(7daea3ee) rgba(a9b665ee) 45deg"
selected-border-width = 0

[popups]
background = "#141617"
border = "#7daea3"
border-width = 2

[menu]
background = "#1d2021"
border = "rgba(7daea3ee) rgba(a9b665ee) 45deg"
border-width = 2
selected-border = "accent"
selected-border-width = "1 1 1 4"

[notifications]
background = "#141617"
border = "#7daea3"
border-width = 2
border-width-left = 6

[lock]
background = "#0f1011"
text = "#ebdbb2"
placeholder = "#7c6f64"
border-active = "rgba(7daea3ee) rgba(a9b665ee) 45deg"
