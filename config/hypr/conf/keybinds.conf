# ==============================================================================
# HYPRLAND KEYBINDINGS (Omarchy Quattro 4.0 Authentic Layout)
# ==============================================================================
$mainMod = SUPER

# --- Essential Applications ---
bindd = $mainMod, Return, Terminal, exec, omarchy-launch-terminal
bindd = $mainMod SHIFT, Return, Browser, exec, omarchy-launch-browser
bindd = $mainMod SHIFT, F, File manager, exec, omarchy-launch-tui yazi
bindd = $mainMod ALT SHIFT, F, File manager (cwd), exec, omarchy-launch-nautilus-cwd
bindd = $mainMod SHIFT, B, Browser, exec, omarchy-launch-browser
bindd = $mainMod SHIFT ALT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = $mainMod SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = $mainMod SHIFT, Q, Calculator, exec, omacalc
binddl = , XF86Calculator, Calculator, exec, omacalc
bindd = $mainMod ALT, Return, Tmux, exec, omarchy-launch-tui tmux
bindd = $mainMod CTRL, Return, Herdr, exec, omarchy-launch-tui herdr
bindd = $mainMod SHIFT, M, Music, exec, omarchy-launch-spotify
bindd = $mainMod SHIFT ALT, M, Music TUI, exec, omarchy-launch-tui cliamp
bindd = $mainMod SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = $mainMod SHIFT, G, Signal, exec, omarchy-launch-signal
bindd = $mainMod SHIFT, O, Obsidian, exec, obsidian
bindd = $mainMod SHIFT, W, Omawrite, exec, omawrite
bindd = $mainMod SHIFT, Slash, Passwords, exec, omarchy-launch-1password
bindd = $mainMod SHIFT, T, Activity, exec, omarchy-launch-tui btop

# --- Web Apps ---
bindd = $mainMod SHIFT, A, ChatGPT, exec, omarchy-launch-webapp https://chatgpt.com
bindd = $mainMod SHIFT ALT, A, Grok, exec, omarchy-launch-webapp https://grok.com
bindd = $mainMod SHIFT, C, Calendar, exec, omarchy-launch-webapp https://app.hey.com/calendar/weeks/
bindd = $mainMod SHIFT, E, Email, exec, omarchy-launch-webapp https://app.hey.com
bindd = $mainMod SHIFT ALT, E, New email, exec, omarchy-launch-webapp "https://app.hey.com/messages/new?display=standalone&new_window=true"
bindd = $mainMod SHIFT, Y, YouTube, exec, omarchy-launch-webapp https://youtube.com/
bindd = $mainMod SHIFT ALT, G, WhatsApp, exec, omarchy-launch-webapp https://web.whatsapp.com/
bindd = $mainMod SHIFT CTRL, G, Google Messages, exec, omarchy-launch-webapp https://messages.google.com/web/conversations
bindd = $mainMod SHIFT, P, Google Photos, exec, omarchy-launch-webapp https://photos.google.com/
bindd = $mainMod SHIFT, S, Google Maps, exec, omarchy-launch-webapp https://maps.google.com/
bindd = $mainMod SHIFT, X, X, exec, omarchy-launch-webapp https://x.com/
bindd = $mainMod SHIFT ALT, X, X Post, exec, omarchy-launch-webapp https://x.com/compose/post

# --- Omarchy Menus & Overlays ---
bindd = $mainMod, Space, Omarchy menu, exec, omarchy-shell shell toggle omarchy.menu '{"menu":"root"}'
bindd = $mainMod ALT, Space, Apps, exec, omarchy-shell omarchy.dock apps
bindd = $mainMod CTRL, E, Emojis, exec, omarchy-shell shell toggle omarchy.emojis
bindd = $mainMod CTRL, C, Capture menu, exec, omarchy-shell shell toggle omarchy.menu '{"menu":"capture"}'
bindd = $mainMod CTRL, O, Toggle menu, exec, omarchy-shell shell toggle omarchy.menu '{"menu":"toggle"}'
bindd = $mainMod CTRL, H, Hardware menu, exec, omarchy-shell shell toggle omarchy.menu '{"menu":"hardware"}'
bindd = $mainMod, Escape, System menu, exec, omarchy-shell shell toggle omarchy.menu '{"menu":"system"}'
binddl = , XF86PowerOff, Power menu, exec, omarchy-shell shell toggle omarchy.menu '{"menu":"system"}'
bindd = $mainMod, K, Keybindings, exec, omarchy-menu-keybindings
bindd = $mainMod ALT, K, Tmux keybindings, exec, omarchy-menu-tmux-keybindings
bindd = $mainMod CTRL, K, Herdr keybindings, exec, omarchy-menu-herdr-keybindings
bindd = $mainMod SHIFT, Space, Toggle top bar, exec, omarchy-shell shell toggle omarchy.bar
bindd = $mainMod CTRL, Space, Background switcher, exec, omarchy-shell shell toggle omarchy.menu '{"menu":"background"}'
bindd = $mainMod CTRL, W, Background switcher, exec, omarchy-shell shell toggle omarchy.menu '{"menu":"background"}'
bindd = $mainMod SHIFT CTRL, Space, Theme menu, exec, omarchy-shell shell toggle omarchy.menu '{"menu":"theme"}'
bindd = $mainMod CTRL, T, Theme menu, exec, omarchy-shell shell toggle omarchy.menu '{"menu":"theme"}'
bindd = $mainMod, Backspace, Toggle transparency on a window, exec, omarchy-hyprland-window-transparency-toggle
bindd = $mainMod SHIFT, Backspace, Toggle window gaps, exec, omarchy-hyprland-window-gaps-toggle
bindd = $mainMod CTRL, Backspace, Toggle single-window square aspect, exec, omarchy-hyprland-window-single-square-aspect-toggle
bindd = $mainMod CTRL, S, Share, exec, omarchy-shell shell toggle omarchy.menu '{"menu":"share"}'
bindd = $mainMod CTRL, Period, Transcode, exec, omarchy-transcode
bindd = $mainMod CTRL, R, Set reminder, exec, omarchy-shell shell toggle omarchy.menu '{"menu":"reminder-set"}'
bindd = $mainMod CTRL ALT, R, Show reminders, exec, omarchy-reminder show
bindd = $mainMod SHIFT CTRL, R, Clear reminders, exec, omarchy-reminder clear
bindd = $mainMod CTRL ALT, T, Show time, exec, omarchy-notification-time
bindd = $mainMod CTRL ALT, B, Show battery remaining, exec, omarchy-notification-battery
bindd = $mainMod CTRL ALT, W, Toggle weather, exec, omarchy-notification-weather
bindd = $mainMod CTRL, I, Toggle locking on idle, exec, omarchy-toggle-idle
bindd = $mainMod, L, Lock system, exec, omarchy-system-lock
bindd = $mainMod CTRL, L, Lock system, exec, omarchy-system-lock

# --- Notifications ---
bindd = $mainMod, comma, Dismiss or focus last notification, exec, omarchy-shell notifications act
bindd = $mainMod SHIFT, comma, Dismiss all notifications, exec, omarchy-shell notifications dismissAll
bindd = $mainMod CTRL, comma, Control notifications with the keyboard, exec, omarchy-shell notifications keyboard
bindd = $mainMod ALT, comma, Dismiss last notification, exec, omarchy-shell notifications dismissOne
bindd = $mainMod SHIFT ALT, comma, Open notification history, exec, omarchy-shell notifications showHistory
bindd = $mainMod CTRL ALT, comma, Toggle silencing notifications, exec, omarchy-shell notifications toggleDnd

# --- Captures & OCR ---
bindd = , Print, Screenshot, exec, omarchy-capture-screenshot
bindd = $mainMod CTRL ALT, C, Screenshot, exec, omarchy-capture-screenshot
bindd = ALT, Print, Screenrecording, exec, omarchy-capture-screenrecording --stop-recording || omarchy-menu toggle trigger.capture.screenrecord
bindd = $mainMod, Print, Color picker, exec, pkill hyprpicker || hyprpicker -a
bindd = $mainMod CTRL, Print, Extract text (OCR) from screenshot, exec, omarchy-capture-text

# --- Hardware Bar Panels ---
bindd = $mainMod CTRL, A, Audio, exec, omarchy-shell shell toggle omarchy.audio
bindd = $mainMod CTRL, B, Bluetooth, exec, omarchy-shell shell toggle omarchy.bluetooth
bindd = $mainMod CTRL, D, Display, exec, omarchy-shell shell toggle omarchy.monitor
bindd = $mainMod CTRL ALT, D, Calendar, exec, omarchy-shell shell toggle omarchy.clock
bindd = $mainMod CTRL, N, Network, exec, omarchy-shell shell toggle omarchy.network
bindd = $mainMod CTRL, P, Power, exec, omarchy-shell shell toggle omarchy.power

# --- Universal Clipboard ---
bindd = $mainMod, A, Select all, exec, omarchy-universal-shortcut selectall
bindd = $mainMod, C, Universal copy, exec, omarchy-universal-shortcut copy
bindd = $mainMod, V, Universal paste, exec, omarchy-universal-shortcut paste
bindd = $mainMod, X, Universal cut, exec, omarchy-universal-shortcut cut
bindd = $mainMod CTRL, V, Clipboard manager, exec, omarchy-shell shell toggle omarchy.clipboard

# --- Window Management & Tiling ---
bindd = $mainMod, W, Close window, killactive,
bindd = $mainMod, Q, Close window, killactive,
bindd = CTRL ALT, Delete, Close all windows, exec, omarchy-hyprland-window-close-all
bindd = $mainMod, J, Toggle window split, layoutmsg, togglesplit
bindd = $mainMod, P, Pseudo window, pseudo,
bindd = $mainMod, T, Toggle window floating/tiling, togglefloating,
bindd = $mainMod, F, Full screen, fullscreen, 0
bindd = $mainMod CTRL, F, Tiled full screen, exec, omarchy-hyprland-window-tiled-fullscreen-toggle
bindd = $mainMod ALT, F, Full width, fullscreen, 1
bindd = $mainMod, O, Pop window out (float & pin), exec, omarchy-hyprland-window-pop
bindd = $mainMod ALT, Home, Save window width, exec, omarchy-hyprland-window-width save
bindd = $mainMod, Home, Restore window width, exec, omarchy-hyprland-window-width restore
bindd = $mainMod, L, Cycle workspace layout, exec, omarchy-hyprland-workspace-layout-toggle
bindd = $mainMod ALT, L, Cycle workspace layout back, exec, omarchy-hyprland-workspace-layout-toggle back
bindd = $mainMod, S, Toggle scratchpad, togglespecialworkspace, scratchpad
bindd = $mainMod ALT, S, Move window to scratchpad, movetoworkspacesilent, special:scratchpad
bindd = $mainMod, grave, Toggle Quake console, togglespecialworkspace, qconsole
bindd = $mainMod SHIFT, grave, Move window to Quake console, movetoworkspacesilent, special:qconsole
bindd = $mainMod, M, Minimize window to the dock, exec, omarchy-hyprland-window-minimize

# --- Focus Navigation ---
bindd = $mainMod, left, Focus on left window, movefocus, l
bindd = $mainMod, right, Focus on right window, movefocus, r
bindd = $mainMod, up, Focus on above window, movefocus, u
bindd = $mainMod, down, Focus on below window, movefocus, d
bindd = $mainMod, h, Focus on left window, movefocus, l
bindd = $mainMod, j, Focus on below window, movefocus, d
bindd = $mainMod, k, Focus on above window, movefocus, u
bindd = $mainMod, l, Focus on right window, movefocus, r

# --- Swap Windows ---
bindd = $mainMod SHIFT, left, Swap window to the left, swapwindow, l
bindd = $mainMod SHIFT, right, Swap window to the right, swapwindow, r
bindd = $mainMod SHIFT, up, Swap window up, swapwindow, u
bindd = $mainMod SHIFT, down, Swap window down, swapwindow, d
bindd = $mainMod SHIFT, h, Swap window to the left, swapwindow, l
bindd = $mainMod SHIFT, j, Swap window down, swapwindow, d
bindd = $mainMod SHIFT, k, Swap window up, swapwindow, u
bindd = $mainMod SHIFT, l, Swap window to the right, swapwindow, r

# --- Window Cycling ---
bindd = ALT, Tab, Focus on next window, cyclenext,
bindd = ALT SHIFT, Tab, Focus on previous window, cyclenext, prev
bindd = ALT, Tab, Reveal active window on top, bringactivetotop,
bindd = $mainMod, Tab, Next workspace, workspace, m+1
bindd = $mainMod SHIFT, Tab, Previous workspace, workspace, m-1

# --- Window Resizing ---
bindde = $mainMod CTRL, left, Expand window left, resizeactive, -100 0
bindde = $mainMod CTRL, right, Shrink window left, resizeactive, 100 0
bindde = $mainMod CTRL SHIFT, left, Shrink window up, resizeactive, 0 -100
bindde = $mainMod CTRL SHIFT, right, Expand window down, resizeactive, 0 100

# --- Window Grouping ---
bindd = $mainMod, G, Toggle window grouping, togglegroup,
bindd = $mainMod ALT, G, Move active window out of group, moveoutofgroup,
bindd = $mainMod ALT, Tab, Next window in group, changegroupactive, f
bindd = $mainMod ALT SHIFT, Tab, Previous window in group, changegroupactive, b

# --- Monitor Scaling ---
bindd = $mainMod, slash, Monitor scaling up, exec, omarchy-hyprland-monitor-scaling up
bindd = $mainMod ALT, slash, Monitor scaling down, exec, omarchy-hyprland-monitor-scaling down

# --- Workspaces 1..10 ---
bindd = $mainMod, 1, Switch to workspace 1, workspace, 1
bindd = $mainMod, 2, Switch to workspace 2, workspace, 2
bindd = $mainMod, 3, Switch to workspace 3, workspace, 3
bindd = $mainMod, 4, Switch to workspace 4, workspace, 4
bindd = $mainMod, 5, Switch to workspace 5, workspace, 5
bindd = $mainMod, 6, Switch to workspace 6, workspace, 6
bindd = $mainMod, 7, Switch to workspace 7, workspace, 7
bindd = $mainMod, 8, Switch to workspace 8, workspace, 8
bindd = $mainMod, 9, Switch to workspace 9, workspace, 9
bindd = $mainMod, 0, Switch to workspace 10, workspace, 10

bindd = $mainMod SHIFT, 1, Move window to workspace 1, movetoworkspace, 1
bindd = $mainMod SHIFT, 2, Move window to workspace 2, movetoworkspace, 2
bindd = $mainMod SHIFT, 3, Move window to workspace 3, movetoworkspace, 3
bindd = $mainMod SHIFT, 4, Move window to workspace 4, movetoworkspace, 4
bindd = $mainMod SHIFT, 5, Move window to workspace 5, movetoworkspace, 5
bindd = $mainMod SHIFT, 6, Move window to workspace 6, movetoworkspace, 6
bindd = $mainMod SHIFT, 7, Move window to workspace 7, movetoworkspace, 7
bindd = $mainMod SHIFT, 8, Move window to workspace 8, movetoworkspace, 8
bindd = $mainMod SHIFT, 9, Move window to workspace 9, movetoworkspace, 9
bindd = $mainMod SHIFT, 0, Move window to workspace 10, movetoworkspace, 10

bindd = $mainMod SHIFT ALT, 1, Move window silently to workspace 1, movetoworkspacesilent, 1
bindd = $mainMod SHIFT ALT, 2, Move window silently to workspace 2, movetoworkspacesilent, 2
bindd = $mainMod SHIFT ALT, 3, Move window silently to workspace 3, movetoworkspacesilent, 3
bindd = $mainMod SHIFT ALT, 4, Move window silently to workspace 4, movetoworkspacesilent, 4
bindd = $mainMod SHIFT ALT, 5, Move window silently to workspace 5, movetoworkspacesilent, 5
bindd = $mainMod SHIFT ALT, 6, Move window silently to workspace 6, movetoworkspacesilent, 6
bindd = $mainMod SHIFT ALT, 7, Move window silently to workspace 7, movetoworkspacesilent, 7
bindd = $mainMod SHIFT ALT, 8, Move window silently to workspace 8, movetoworkspacesilent, 8
bindd = $mainMod SHIFT ALT, 9, Move window silently to workspace 9, movetoworkspacesilent, 9
bindd = $mainMod SHIFT ALT, 0, Move window silently to workspace 10, movetoworkspacesilent, 10

# --- Mouse Bindings ---
bind = $mainMod, mouse_down, workspace, m+1
bind = $mainMod, mouse_up, workspace, m-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- Hardware Media & Brightness Keys ---
binddel = , XF86AudioRaiseVolume, Volume up, exec, omarchy-audio-output-volume raise
binddel = , XF86AudioLowerVolume, Volume down, exec, omarchy-audio-output-volume lower
binddl  = , XF86AudioMute, Mute, exec, omarchy-audio-output-volume mute-toggle
binddl  = , XF86AudioMicMute, Mute microphone, exec, omarchy-audio-input-mute
binddel = , XF86MonBrightnessUp, Brightness up, exec, omarchy-brightness-display raise
binddel = , XF86MonBrightnessDown, Brightness down, exec, omarchy-brightness-display lower
binddel = SHIFT, XF86MonBrightnessUp, Brightness maximum, exec, omarchy-brightness-display 100%
binddel = SHIFT, XF86MonBrightnessDown, Brightness minimum, exec, omarchy-brightness-display 1%
binddel = ALT, XF86AudioRaiseVolume, Volume up precise, exec, omarchy-audio-output-volume +1
binddel = ALT, XF86AudioLowerVolume, Volume down precise, exec, omarchy-audio-output-volume -1
binddel = ALT, XF86MonBrightnessUp, Brightness up precise, exec, omarchy-brightness-display +1%
binddel = ALT, XF86MonBrightnessDown, Brightness down precise, exec, omarchy-brightness-display 1%-
binddl  = , XF86AudioPlay, Play, exec, playerctl play-pause
binddl  = , XF86AudioPause, Pause, exec, playerctl play-pause
binddl  = , XF86AudioNext, Next track, exec, playerctl next
binddl  = , XF86AudioPrev, Previous track, exec, playerctl previous
binddl  = SHIFT, XF86AudioMute, Switch audio output, exec, omarchy-audio-output-switch
binddl  = SHIFT, XF86AudioPlay, Switch media source, exec, omarchy-audio-source-switch
