# ==============================================================================
# QUATTRO VISUAL GEOMETRY & ANIMATIONS
# ==============================================================================

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = $active_border
    col.inactive_border = $inactive_border
    layout = dwindle
    allow_tearing = false
    resize_on_border = true
}

decoration {
    rounding = 6
    active_opacity = 1.0
    inactive_opacity = 0.96
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 16
        render_power = 3
        color = rgba(0e0e14cc)
    }

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        xray = false
        noise = 0.0117
        contrast = 0.92
        brightness = 0.86
        vibrancy = 0.18
    }
}

animations {
    enabled = true
    bezier = quattroOut, 0.16, 1, 0.3, 1
    bezier = liner, 1, 1, 1, 1

    animation = windows, 1, 3.2, quattroOut, popin 84%
    animation = windowsIn, 1, 3.2, quattroOut, popin 84%
    animation = windowsOut, 1, 2.6, quattroOut, popin 86%
    animation = windowsMove, 1, 3.0, quattroOut, slide
    animation = border, 1, 6, liner
    animation = fade, 1, 2.8, quattroOut
    animation = workspaces, 1, 3.5, quattroOut, slide
    animation = specialWorkspace, 1, 3.2, quattroOut, slidevert
}

dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
}

master {
    new_status = master
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    background_color = 0x1a1b26
    vfr = true
    focus_on_activate = true
}
