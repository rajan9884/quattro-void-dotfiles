env = USER,rajan
env = HOME,/home/rajan
env = OMARCHY_PATH,/usr/share/omarchy
env = PATH,/home/rajan/.local/bin:/usr/share/omarchy/bin:/usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin
env = QML2_IMPORT_PATH,/home/rajan/.config/quickshell:/usr/share/omarchy/shell

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = GDK_BACKEND,wayland,x11,*
