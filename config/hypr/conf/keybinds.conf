# ==============================================================================
# HYPRLAND KEYBINDINGS (Omarchy Quattro Authentic Layout)
# ==============================================================================
$mainMod = SUPER
$term = ~/.local/bin/launch-term
$tuiFloat = ~/.local/bin/launch-tui-float
$tuiPopup = ~/.local/bin/launch-tui-popup
$qs = ~/.local/bin/qshell-ctl

# --- Core Applications & Terminals ---
bindd = $mainMod, Return, Terminal, exec, $term
bindd = $mainMod SHIFT, Return, Browser, exec, chromium
bindd = $mainMod SHIFT, F, File manager, exec, $tuiFloat yazi
bindd = $mainMod, E, File manager, exec, $tuiFloat yazi
bindd = $mainMod, B, Activity monitor, exec, $tuiFloat btop
bindd = $mainMod, G, Git client, exec, $tuiFloat lazygit
bindd = $mainMod SHIFT, N, Editor, exec, nvim
bindd = $mainMod SHIFT, Q, Calculator, exec, omacalc

# --- Omarchy Quattro Shell Menus & Overlays ---
bindd = $mainMod, Space, Omarchy menu, exec, $qs toggle omarchy.menu
bindd = $mainMod ALT, Space, Apps, exec, $qs toggle omarchy.apps
bindd = $mainMod, Period, Clipboard history, exec, $qs toggle omarchy.clipboard
bindd = $mainMod CTRL, V, Clipboard history, exec, $qs toggle omarchy.clipboard
bindd = $mainMod, K, Keybindings cheatsheet, exec, omarchy-menu-keybindings
bindd = $mainMod ALT, K, Tmux keybindings, exec, omarchy-menu-tmux-keybindings
bindd = $mainMod SHIFT ALT, Comma, Notification history, exec, $qs toggle omarchy.notifications
bindd = $mainMod, Escape, Power menu, exec, $qs toggle omarchy.power
bindd = $mainMod CTRL, L, Lock system, exec, $qs lock
bindd = $mainMod, L, Lock system, exec, $qs lock
bindd = $mainMod SHIFT, R, Reload desktop, exec, ~/.local/bin/reload-desktop

# --- Omarchy Quattro Hardware Control Panels ---
bindd = $mainMod CTRL, A, Audio, exec, $qs toggle omarchy.audio
bindd = $mainMod CTRL, B, Bluetooth, exec, $qs toggle omarchy.bluetooth
bindd = $mainMod CTRL, W, Network, exec, $qs toggle omarchy.network
bindd = $mainMod CTRL, N, Network, exec, $qs toggle omarchy.network
bindd = $mainMod CTRL, D, Display, exec, $qs toggle omarchy.monitor
bindd = $mainMod CTRL, P, Power, exec, $qs toggle omarchy.power
bindd = $mainMod CTRL, T, Theme menu, exec, $qs toggle omarchy.themes

# --- Window Management & Tiling ---
bindd = $mainMod, W, Close window, killactive,
bindd = $mainMod, Q, Close window, killactive,
bindd = $mainMod, F, Full screen, fullscreen, 0
bindd = $mainMod SHIFT, Space, Toggle window floating/tiling, togglefloating,
bindd = $mainMod, T, Toggle window floating/tiling, togglefloating,
bindd = $mainMod, P, Pseudo window, pseudo,
bindd = $mainMod, J, Toggle window split, layoutmsg, togglesplit

# --- Focus Navigation ---
bindd = $mainMod, left, Focus left, movefocus, l
bindd = $mainMod, right, Focus right, movefocus, r
bindd = $mainMod, up, Focus up, movefocus, u
bindd = $mainMod, down, Focus down, movefocus, d
bindd = $mainMod, h, Focus left, movefocus, l
bindd = $mainMod, j, Focus down, movefocus, d
bindd = $mainMod, k, Focus up, movefocus, u
bindd = $mainMod, l, Focus right, movefocus, r

# --- Move Windows ---
bindd = $mainMod SHIFT, left, Move window left, movewindow, l
bindd = $mainMod SHIFT, right, Move window right, movewindow, r
bindd = $mainMod SHIFT, up, Move window up, movewindow, u
bindd = $mainMod SHIFT, down, Move window down, movewindow, d
bindd = $mainMod SHIFT, h, Move window left, movewindow, l
bindd = $mainMod SHIFT, j, Move window down, movewindow, d
bindd = $mainMod SHIFT, k, Move window up, movewindow, u
bindd = $mainMod SHIFT, l, Move window right, movewindow, r

# --- Resize Windows ---
bindde = $mainMod CTRL, left, Resize window left, resizeactive, -40 0
bindde = $mainMod CTRL, right, Resize window right, resizeactive, 40 0
bindde = $mainMod CTRL, up, Resize window up, resizeactive, 0 -40
bindde = $mainMod CTRL, down, Resize window down, resizeactive, 0 40

# --- Workspaces (1..9) ---
bindd = $mainMod, 1, Switch to workspace 1, workspace, 1
bindd = $mainMod, 2, Switch to workspace 2, workspace, 2
bindd = $mainMod, 3, Switch to workspace 3, workspace, 3
bindd = $mainMod, 4, Switch to workspace 4, workspace, 4
bindd = $mainMod, 5, Switch to workspace 5, workspace, 5
bindd = $mainMod, 6, Switch to workspace 6, workspace, 6
bindd = $mainMod, 7, Switch to workspace 7, workspace, 7
bindd = $mainMod, 8, Switch to workspace 8, workspace, 8
bindd = $mainMod, 9, Switch to workspace 9, workspace, 9

bindd = $mainMod SHIFT, 1, Move window to workspace 1, movetoworkspace, 1
bindd = $mainMod SHIFT, 2, Move window to workspace 2, movetoworkspace, 2
bindd = $mainMod SHIFT, 3, Move window to workspace 3, movetoworkspace, 3
bindd = $mainMod SHIFT, 4, Move window to workspace 4, movetoworkspace, 4
bindd = $mainMod SHIFT, 5, Move window to workspace 5, movetoworkspace, 5
bindd = $mainMod SHIFT, 6, Move window to workspace 6, movetoworkspace, 6
bindd = $mainMod SHIFT, 7, Move window to workspace 7, movetoworkspace, 7
bindd = $mainMod SHIFT, 8, Move window to workspace 8, movetoworkspace, 8
bindd = $mainMod SHIFT, 9, Move window to workspace 9, movetoworkspace, 9

# --- Scratchpad Workspace ---
bindd = $mainMod, S, Toggle scratchpad, togglespecialworkspace, magic
bindd = $mainMod SHIFT, S, Move window to scratchpad, movetoworkspace, special:magic

# --- Mouse Workspace & Window Bindings ---
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- Screenshots & Color Picker ---
bindd = , Print, Screenshot region, exec, ~/.local/bin/screenshot region
bindd = SHIFT, Print, Screenshot full, exec, ~/.local/bin/screenshot full
bindd = $mainMod SHIFT, P, Screenshot region, exec, ~/.local/bin/screenshot region
bindd = $mainMod SHIFT, C, Color picker, exec, hyprpicker -a
bindd = $mainMod, Print, Color picker, exec, hyprpicker -a

# --- Hardware Media & Brightness Keys (Routes through Quickshell OSD) ---
binddel = , XF86AudioRaiseVolume, Volume up, exec, $qs osd volume-up
binddel = , XF86AudioLowerVolume, Volume down, exec, $qs osd volume-down
binddl  = , XF86AudioMute, Mute audio, exec, $qs osd volume-mute
binddl  = , XF86AudioMicMute, Mute microphone, exec, $qs osd mic-mute
binddel = , XF86MonBrightnessUp, Brightness up, exec, $qs osd brightness-up
binddel = , XF86MonBrightnessDown, Brightness down, exec, $qs osd brightness-down
binddl  = , XF86AudioPlay, Play / Pause media, exec, playerctl play-pause
binddl  = , XF86AudioNext, Next track, exec, playerctl next
binddl  = , XF86AudioPrev, Previous track, exec, playerctl previous
