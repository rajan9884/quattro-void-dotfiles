# ==============================================================================
# FLOATING TUI SCRATCHPADS & QUICKSHELL LAYER RULES
# ==============================================================================

# Centered Floating TUI Windows (yazi, btop, lazygit, calcurse, wiremix, impala, bluetuith)
windowrulev2 = float, class:^(tui-float)$
windowrulev2 = center, class:^(tui-float)$
windowrulev2 = size 940 620, class:^(tui-float)$
windowrulev2 = dimaround, class:^(tui-float)$
windowrulev2 = stayfocused, class:^(tui-float)$

windowrulev2 = float, class:^(tui-popup)$
windowrulev2 = center, class:^(tui-popup)$
windowrulev2 = size 760 520, class:^(tui-popup)$
windowrulev2 = dimaround, class:^(tui-popup)$

# Picture-in-Picture
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin, title:^(Picture-in-Picture)$
windowrulev2 = size 480 270, title:^(Picture-in-Picture)$
windowrulev2 = move 100%-500 100%-300, title:^(Picture-in-Picture)$

# Quickshell Layer Blur
layerrule = blur, quickshell
layerrule = ignorezero, quickshell
