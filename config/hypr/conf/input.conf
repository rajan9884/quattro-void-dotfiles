# ==============================================================================
# KEYBOARD, COMPOSE KEY & TOUCHPAD CONFIGURATION
# ==============================================================================

input {
    kb_layout = us
    kb_options = compose:caps,grp:shifts_toggle
    repeat_rate = 45
    repeat_delay = 220
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
        clickfinger_behavior = true
    }
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}
