# Acer Swift Go 14 (SFG14-71) speaker tuning filter-chain.
#
# Provides highpass protection (80Hz), bass punch enhancement (135Hz),
# boxiness resonance cut (450Hz), speech/dialog clarity lift (2.8kHz),
# high-shelf presence (8kHz), and an LSP lookahead limiter with gentle input
# preamp gain (+3 dB) to maximize loudness without clipping.

context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Laptop Speakers (Tuned)"
      media.name       = "Laptop Speakers (Tuned)"

      filter.graph = {
        nodes = [
          { type = builtin name = hp_l      label = bq_highpass  control = { "Freq" = 80.0 "Q" = 0.707 } }
          { type = builtin name = bass_l    label = bq_peaking   control = { "Freq" = 135.0 "Q" = 1.4 "Gain" = 4.0 } }
          { type = builtin name = box_l     label = bq_peaking   control = { "Freq" = 450.0 "Q" = 1.2 "Gain" = -2.5 } }
          { type = builtin name = pres_l    label = bq_peaking   control = { "Freq" = 2800.0 "Q" = 1.0 "Gain" = 3.0 } }
          { type = builtin name = air_l     label = bq_highshelf control = { "Freq" = 8000.0 "Q" = 0.707 "Gain" = 2.0 } }

          { type = builtin name = hp_r      label = bq_highpass  control = { "Freq" = 80.0 "Q" = 0.707 } }
          { type = builtin name = bass_r    label = bq_peaking   control = { "Freq" = 135.0 "Q" = 1.4 "Gain" = 4.0 } }
          { type = builtin name = box_r     label = bq_peaking   control = { "Freq" = 450.0 "Q" = 1.2 "Gain" = -2.5 } }
          { type = builtin name = pres_r    label = bq_peaking   control = { "Freq" = 2800.0 "Q" = 1.0 "Gain" = 3.0 } }
          { type = builtin name = air_r     label = bq_highshelf control = { "Freq" = 8000.0 "Q" = 0.707 "Gain" = 2.0 } }

          { type   = lv2
            name   = limiter
            plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
            control = {
              "alr"   = 0
              "boost" = 0
              "g_in"  = 1.412
              "th"    = 0.944
            }
          }
        ]

        links = [
          { output = "hp_l:Out" input = "bass_l:In" }
          { output = "bass_l:Out" input = "box_l:In" }
          { output = "box_l:Out" input = "pres_l:In" }
          { output = "pres_l:Out" input = "air_l:In" }
          { output = "air_l:Out" input = "limiter:in_l" }

          { output = "hp_r:Out" input = "bass_r:In" }
          { output = "bass_r:Out" input = "box_r:In" }
          { output = "box_r:Out" input = "pres_r:In" }
          { output = "pres_r:Out" input = "air_r:In" }
          { output = "air_r:Out" input = "limiter:in_r" }
        ]

        inputs  = [ "hp_l:In" "hp_r:In" ]
        outputs = [ "limiter:out_l" "limiter:out_r" ]
      }

      audio.channels = 2
      audio.position = [ FL FR ]

      capture.props = {
        node.name   = "omarchy_speaker_tuning"
        media.class = Audio/Sink
      }
      playback.props = {
        node.name     = "omarchy_speaker_tuning_output"
        node.passive  = true
        target.object = "@SPEAKER_SINK@"
        node.dont-move = true
        node.dont-fallback = true
        node.linger = true
      }
    }
  }
]
