# ==============================================================================
# HYPRLAND KEYBINDINGS (Omarchy Quattro 4.0 Exact Authentic Layout)
# 1:1 parity with Omarchy default/hypr/bindings/*.lua
# ==============================================================================
$mainMod = SUPER

# --- Apps & Launchers ---
bindd = $mainMod, RETURN, Terminal, exec, void-launch-terminal
bindd = $mainMod SHIFT, RETURN, Browser, exec, void-launch-browser
bindd = $mainMod SHIFT, F, File manager, exec, void-launch-tui yazi
bindd = $mainMod ALT SHIFT, F, File manager (cwd), exec, void-launch-nautilus-cwd
bindd = $mainMod SHIFT, B, Browser, exec, void-launch-browser
bindd = $mainMod SHIFT ALT, B, Browser (private), exec, void-launch-browser --private
bindd = $mainMod SHIFT, N, Editor, exec, void-launch-editor
bindd = $mainMod ALT, RETURN, Tmux, exec, void-launch-terminal-tmux
bindd = $mainMod CTRL, RETURN, Herdr, exec, void-launch-terminal-herdr
bindd = $mainMod SHIFT, M, Music, exec, void-launch-tui cliamp
bindd = $mainMod SHIFT ALT, M, Music TUI, exec, void-launch-tui cliamp
bindd = $mainMod SHIFT, D, Docker, exec, void-launch-tui void-launch-docker-tui
bindd = $mainMod SHIFT, O, Obsidian, exec, obsidian
bindd = CTRL, SPACE, Direct input for the terminal prefix, pass, ^(foot|footclient|Alacritty|kitty|ghostty)$
bindd = $mainMod ALT, K, Tmux keybindings, exec, void-menu-tmux-keybindings
bindd = $mainMod CTRL, K, Herdr keybindings, exec, void-menu-herdr-keybindings
bindd = $mainMod SHIFT, T, Activity, exec, void-launch-tui btop

# --- Clipboard & Selection ---
bindd = $mainMod, A, Select all, exec, void-universal-shortcut select-all
bindd = $mainMod, C, Universal copy, exec, void-universal-shortcut copy
bindd = $mainMod, V, Universal paste, exec, void-universal-shortcut paste
bindd = $mainMod, X, Universal cut, exec, void-universal-shortcut cut
bindd = $mainMod CTRL, V, Clipboard manager, exec, void-shell shell toggle omarchy.clipboard

# --- Input Method ---

# --- Window Management & Focus ---
bindd = $mainMod, W, Close window, killactive, 
bindd = $mainMod, Q, Close window, killactive, 
bindd = $mainMod, J, Toggle window split, layoutmsg, togglesplit
bindd = $mainMod, P, Pseudo window, pseudo, 
bindd = $mainMod, T, Toggle floating window, exec, void-toggle-floating-centered
bindd = $mainMod, F, Full screen, fullscreen, 0
bindd = $mainMod CTRL, F, Tiled full screen, exec, void-hyprland-window-tiled-fullscreen-toggle
bindd = $mainMod ALT, F, Full width, fullscreen, 1
bindd = $mainMod, O, Pop window out (float & pin), exec, void-hyprland-window-pop
bindd = $mainMod ALT, Home, Save window width, exec, void-hyprland-window-width save
bindd = $mainMod, Home, Restore window width, exec, void-hyprland-window-width restore
bindd = $mainMod, LEFT, Focus on left window, movefocus, l
bindd = $mainMod, RIGHT, Focus on right window, movefocus, r
bindd = $mainMod, UP, Focus on above window, movefocus, u
bindd = $mainMod, DOWN, Focus on below window, movefocus, d
bindd = $mainMod SHIFT, grave, Move window to Quake console, movetoworkspacesilent, special:qconsole
bindd = $mainMod SHIFT, LEFT, Swap window to the left, swapwindow, l
bindd = $mainMod SHIFT, RIGHT, Swap window to the right, swapwindow, r
bindd = $mainMod SHIFT, UP, Swap window up, swapwindow, u
bindd = $mainMod SHIFT, DOWN, Swap window down, swapwindow, d
bindd = ALT, TAB, Focus on next window, cyclenext, 
bindd = ALT SHIFT, TAB, Focus on previous window, cyclenext, prev
bindd = ALT, TAB, Reveal active window on top, bringactivetotop, 
bindd = ALT SHIFT, TAB, Reveal active window on top, bringactivetotop, 
bindm = $mainMod, mouse:272, 
bindd = $mainMod CTRL ALT, F, Toggle full screen desktop, exec, void-toggle-fullscreen-desktop

# --- Window Resizing (Super + = / -) ---
bindd = $mainMod, code:20, Expand window left, resizeactive, -100 0
bindd = $mainMod, code:21, Shrink window left, resizeactive, 100 0
bindd = $mainMod SHIFT, code:20, Shrink window up, resizeactive, 0 -100
bindd = $mainMod SHIFT, code:21, Expand window down, resizeactive, 0 100
bindd = $mainMod ALT, code:20, Expand window left a little, resizeactive, -25 0
bindd = $mainMod ALT, code:21, Shrink window left a little, resizeactive, 25 0
bindd = $mainMod SHIFT ALT, code:20, Shrink window up a little, resizeactive, 0 -25
bindd = $mainMod SHIFT ALT, code:21, Expand window down a little, resizeactive, 0 25
bindd = $mainMod CTRL, code:20, Expand window left a lot, resizeactive, -300 0
bindd = $mainMod CTRL, code:21, Shrink window left a lot, resizeactive, 300 0
bindd = $mainMod CTRL SHIFT, code:20, Shrink window up a lot, resizeactive, 0 -300
bindd = $mainMod CTRL SHIFT, code:21, Expand window down a lot, resizeactive, 0 300

# --- Workspaces & Monitors ---
bindd = $mainMod, L, Cycle workspace layout, exec, void-hyprland-workspace-layout-toggle
bindd = $mainMod ALT, L, Cycle workspace layout back, exec, void-hyprland-workspace-layout-toggle back
bindd = $mainMod, S, Toggle scratchpad, togglespecialworkspace, scratchpad
bindd = $mainMod ALT, S, Move window to scratchpad, movetoworkspacesilent, special:scratchpad
bindd = $mainMod, TAB, Next workspace, workspace, m+1
bindd = $mainMod SHIFT, TAB, Previous workspace, workspace, m-1
bindd = $mainMod CTRL, TAB, Former workspace, workspace, previous_per_monitor
bindd = $mainMod SHIFT ALT, LEFT, Move workspace to left monitor, exec, movecurrentworkspacetomonitor
bindd = $mainMod SHIFT ALT, RIGHT, Move workspace to right monitor, exec, movecurrentworkspacetomonitor
bindd = $mainMod SHIFT ALT, UP, Move workspace to up monitor, exec, movecurrentworkspacetomonitor
bindd = $mainMod SHIFT ALT, DOWN, Move workspace to down monitor, exec, movecurrentworkspacetomonitor
bindd = $mainMod SHIFT CTRL, LEFT, Move window to left monitor, exec, movewindow
bindd = $mainMod SHIFT CTRL, RIGHT, Move window to right monitor, exec, movewindow
bindd = $mainMod SHIFT CTRL, UP, Move window to up monitor, exec, movewindow
bindd = $mainMod SHIFT CTRL, DOWN, Move window to down monitor, exec, movewindow
bindd = CTRL ALT, TAB, Focus on next monitor, focusmonitor, +1
bindd = CTRL ALT SHIFT, TAB, Focus on previous monitor, focusmonitor, -1
bindd = $mainMod, mouse_down, Scroll active workspace forward, workspace, m+1
bindd = $mainMod, mouse_up, Scroll active workspace backward, workspace, m-1
bindd = $mainMod, SLASH, Monitor scaling up, exec, void-hyprland-monitor-scaling up
bindd = $mainMod ALT, SLASH, Monitor scaling down, exec, void-hyprland-monitor-scaling down

# --- Window Grouping ---
bindd = $mainMod, G, Toggle window grouping, togglegroup, 
bindd = $mainMod ALT, G, Move active window out of group, moveoutofgroup, 
bindd = $mainMod ALT, LEFT, Move window to group on left, moveintogroup, l
bindd = $mainMod ALT, RIGHT, Move window to group on right, moveintogroup, r
bindd = $mainMod ALT, UP, Move window to group on top, moveintogroup, u
bindd = $mainMod ALT, DOWN, Move window to group on bottom, moveintogroup, d
bindd = $mainMod ALT, TAB, Next window in group, changegroupactive, f
bindd = $mainMod ALT SHIFT, TAB, Previous window in group, changegroupactive, b
bindd = $mainMod CTRL, LEFT, Move grouped window focus left, changegroupactive, b
bindd = $mainMod CTRL, RIGHT, Move grouped window focus right, changegroupactive, f
bindd = $mainMod ALT, mouse_down, Next window in group, changegroupactive, f
bindd = $mainMod ALT, mouse_up, Previous window in group, changegroupactive, b
bindd = $mainMod ALT, code:10, Switch to group window 1, changegroupactive, 1
bindd = $mainMod ALT, code:11, Switch to group window 2, changegroupactive, 2
bindd = $mainMod ALT, code:12, Switch to group window 3, changegroupactive, 3
bindd = $mainMod ALT, code:13, Switch to group window 4, changegroupactive, 4
bindd = $mainMod ALT, code:14, Switch to group window 5, changegroupactive, 5

# --- Menus & Bar Panels ---
bindd = $mainMod, SPACE, Void menu, exec, void-shell shell toggle omarchy.menu '{"menu":"root"}'
bindd = $mainMod ALT, SPACE, Apps, exec, void-shell omarchy.dock apps
bindd = $mainMod CTRL, E, Emojis, exec, void-shell shell toggle omarchy.emojis
bindd = $mainMod CTRL, C, Capture menu, exec, void-shell shell toggle omarchy.menu '{"menu":"capture"}'
bindd = $mainMod CTRL, O, Toggle menu, exec, void-shell shell toggle omarchy.menu '{"menu":"toggle"}'
bindd = $mainMod CTRL, H, Hardware menu, exec, void-shell shell toggle omarchy.menu '{"menu":"hardware"}'
bindd = $mainMod SHIFT, code:201, Void menu, exec, void-shell shell toggle omarchy.menu '{"menu":"root"}'
bindd = $mainMod, ESCAPE, System menu, exec, void-shell shell toggle omarchy.menu '{"menu":"system"}'
binddl = , XF86PowerOff, Power menu, exec, void-shell shell toggle omarchy.menu '{"menu":"system"}'
bindd = $mainMod SHIFT, SPACE, Toggle top bar, exec, void-shell shell toggle omarchy.bar
bindd = $mainMod CTRL, SPACE, Background switcher, global, omarchy:menu.background
bindd = $mainMod CTRL, W, Background switcher, global, omarchy:menu.background
bindd = $mainMod SHIFT CTRL, SPACE, Theme menu, exec, void-shell shell toggle omarchy.menu '{"menu":"theme"}'
bindd = $mainMod CTRL, S, Share, exec, void-shell shell toggle omarchy.menu '{"menu":"share"}'
bindd = $mainMod CTRL, PERIOD, Transcode, exec, void-transcode
bindd = $mainMod CTRL, code:10, Bar panel 1, exec, void-shell -q shell togglePanelAt right 1
bindd = $mainMod CTRL, code:11, Bar panel 2, exec, void-shell -q shell togglePanelAt right 2
bindd = $mainMod CTRL, code:12, Bar panel 3, exec, void-shell -q shell togglePanelAt right 3
bindd = $mainMod CTRL, code:13, Bar panel 4, exec, void-shell -q shell togglePanelAt right 4
bindd = $mainMod CTRL, code:14, Bar panel 5, exec, void-shell -q shell togglePanelAt right 5
bindd = $mainMod CTRL, code:15, Bar panel 6, exec, void-shell -q shell togglePanelAt right 6
bindd = $mainMod CTRL, code:16, Bar panel 7, exec, void-shell -q shell togglePanelAt right 7
bindd = $mainMod CTRL, code:17, Bar panel 8, exec, void-shell -q shell togglePanelAt right 8
bindd = $mainMod CTRL, code:18, Bar panel 9, exec, void-shell -q shell togglePanelAt right 9

# --- Notifications ---
bindd = $mainMod, comma, Dismiss last notification, exec, void-shell -q ipc notifications.dismissOne
bindd = $mainMod SHIFT, comma, Dismiss all notifications, exec, void-shell -q ipc notifications.dismissAll
bindd = $mainMod CTRL, comma, Control notifications with the keyboard, exec, void-shell -q ipc notifications.keyboard
bindd = $mainMod ALT, comma, Dismiss or invoke or focus last notification, exec, void-shell -q ipc notifications.act
bindd = $mainMod SHIFT ALT, comma, Open notification history, exec, void-shell -q ipc notifications.showHistory
bindd = $mainMod CTRL ALT, comma, Toggle silencing notifications, exec, void-toggle-notifications

# --- Screenshot & Capture ---
bindd = , PRINT, Screenshot, exec, void-capture-screenshot
bindd = $mainMod CTRL ALT, C, Screenshot, exec, void-capture-screenshot
bindd = ALT, PRINT, Screenrecording, exec, void-capture-screenrecording --stop-recording || void-menu toggle trigger.capture.screenrecord
bindd = $mainMod ALT, code:34, Make webcam overlay smaller, exec, void-capture-webcam-resize smaller
bindd = $mainMod ALT, code:35, Make webcam overlay larger, exec, void-capture-webcam-resize larger
bindd = $mainMod, PRINT, Color picker, exec, pkill hyprpicker || hyprpicker -a
bindd = $mainMod CTRL, PRINT, Extract text (OCR) from screenshot, exec, void-capture-text

# --- Hardware & Media Controls ---
binddel = , XF86AudioRaiseVolume, Volume up, exec, void-audio-output-volume raise
binddel = , XF86AudioLowerVolume, Volume down, exec, void-audio-output-volume lower
binddl = , XF86AudioMute, Mute, exec, void-audio-output-volume mute-toggle
binddl = , XF86AudioMicMute, Mute microphone, exec, void-audio-input-mute
binddel = , XF86MonBrightnessUp, Brightness up, exec, void-brightness-display raise
binddel = , XF86MonBrightnessDown, Brightness down, exec, void-brightness-display lower
binddel = SHIFT, XF86MonBrightnessUp, Brightness maximum, exec, void-brightness-display 100%
binddel = SHIFT, XF86MonBrightnessDown, Brightness minimum, exec, void-brightness-display 1%
binddel = , XF86KbdBrightnessUp, Keyboard brightness up, exec, void-brightness-keyboard up
binddel = , XF86KbdBrightnessDown, Keyboard brightness down, exec, void-brightness-keyboard down
binddl = , XF86TouchpadToggle, Toggle touchpad, exec, void-toggle-touchpad
binddl = , XF86TouchpadOn, Enable touchpad, exec, void-toggle-touchpad on
binddl = , XF86TouchpadOff, Disable touchpad, exec, void-toggle-touchpad off
binddel = ALT, XF86AudioRaiseVolume, Volume up precise, exec, void-audio-output-volume +1
binddel = ALT, XF86AudioLowerVolume, Volume down precise, exec, void-audio-output-volume -1
binddel = ALT, XF86MonBrightnessUp, Brightness up precise, exec, void-brightness-display +1%
binddel = ALT, XF86MonBrightnessDown, Brightness down precise, exec, void-brightness-display 1%-
binddl = , XF86AudioNext, Next track, exec, void-shell -q ipc media.next
binddl = ALT, XF86AudioPlay, Next track, exec, void-shell -q ipc media.next
binddl = , XF86AudioPause, Pause, exec, void-shell -q ipc media.playPause
binddl = , XF86AudioPlay, Play, exec, void-shell -q ipc media.playPause
binddl = , XF86AudioPrev, Previous track, exec, void-shell -q ipc media.previous
binddl = ALT SHIFT, XF86AudioPlay, Previous track, exec, void-shell -q ipc media.previous
binddl = , XF86Eject, Eject media, exec, eject
bindd = $mainMod CTRL, Delete, Toggle laptop display, exec, void-hyprland-monitor-internal toggle
bindd = $mainMod CTRL ALT, Delete, Toggle laptop display mirroring, exec, void-hyprland-monitor-internal-mirror toggle
bindd = $mainMod CTRL, D, Display, exec, void-shell shell toggle omarchy.monitor

# --- Reminders & Status OSD ---
bindd = $mainMod CTRL, R, Set reminder, exec, void-shell shell toggle omarchy.menu '{"menu":"reminder-set"}'
bindd = $mainMod CTRL ALT, R, Show reminders, exec, void-reminder show
bindd = $mainMod SHIFT CTRL, R, Clear reminders, exec, void-reminder clear
bindd = $mainMod CTRL ALT, T, Show time, exec, void-notification-time
bindd = $mainMod CTRL ALT, B, Show battery remaining, exec, void-notification-battery
bindd = $mainMod CTRL ALT, W, Toggle weather, exec, void-notification-weather

# --- System Controls ---
binddl = , XF86KbdLightOnOff, Keyboard backlight cycle, exec, void-brightness-keyboard cycle
binddl = SHIFT, XF86AudioMute, Switch audio output, exec, void-audio-output-switch
binddl = SHIFT, XF86AudioPause, Switch media source, exec, void-audio-source-switch
binddl = SHIFT, XF86AudioPlay, Switch media source, exec, void-audio-source-switch
bindd = CTRL ALT, DELETE, Close all windows, exec, void-hyprland-window-close-all
bindd = $mainMod, grave, Toggle Quake console, togglespecialworkspace, qconsole
bindd = $mainMod, M, Minimize window to the dock, exec, void-hyprland-window-minimize
bindm = $mainMod, mouse:273, 
bindd = $mainMod, K, Keybindings, exec, void-menu-keybindings
bindd = $mainMod, BACKSPACE, Toggle transparency on a window, exec, void-hyprland-window-transparency-toggle
bindd = $mainMod SHIFT, BACKSPACE, Toggle window gaps, exec, void-hyprland-window-gaps-toggle
bindd = $mainMod CTRL, BACKSPACE, Toggle single-window square aspect, exec, void-hyprland-window-single-square-aspect-toggle
bindd = $mainMod CTRL, I, Toggle locking on idle, exec, void-toggle-idle
bind = , switch:on:Lid Switch, exec, void-system-lid-close
bind = , switch:off:Lid Switch, exec, void-hyprland-monitor-clamshell
bindd = $mainMod SHIFT CTRL, A, Agent, exec, void-agent --pick
bindd = $mainMod CTRL, A, Audio, exec, void-shell shell toggle omarchy.audio
bindd = $mainMod CTRL, B, Bluetooth, exec, void-shell shell toggle omarchy.bluetooth
bindd = $mainMod CTRL ALT, D, Calendar, exec, void-shell shell toggle omarchy.clock
bindd = $mainMod CTRL ALT, E, World clock, exec, void-shell shell toggle omarchy.elsewhen
bindd = $mainMod CTRL, N, Network, exec, void-shell shell toggle omarchy.network
bindd = $mainMod CTRL, P, Power, exec, void-shell shell toggle omarchy.power
bindd = $mainMod CTRL, Z, Zoom in, exec, void-zoom-in
bindd = $mainMod CTRL ALT, Z, Reset zoom, exec, void-zoom-reset
bindd = $mainMod CTRL, L, Lock system, exec, void-system-lock

# --- Workspaces 1..10 ---
bindd = $mainMod, 1, Switch to workspace 1, workspace, 1
bindd = $mainMod, 2, Switch to workspace 2, workspace, 2
bindd = $mainMod, 3, Switch to workspace 3, workspace, 3
bindd = $mainMod, 4, Switch to workspace 4, workspace, 4
