# ==============================================================================
# QUATTRO SINGLE-PROCESS AUTOSTART
# No Waybar, No Rofi, No Walker, No Mako, No SwayOSD, No Swaybg!
# Everything runs inside the single long-running Quickshell desktop host.
# ==============================================================================

# 1. Propagate Wayland environment to DBus activation
exec-once = dbus-update-activation-environment --systemd --all || dbus-update-activation-environment --all

# 2. Start PipeWire + WirePlumber user audio stack on Void Linux
exec-once = ~/.local/bin/void-audio-init

# 3. Start Clipboard History Watcher (read natively by Quickshell ClipboardOverlay)
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# 4. Build initial desktop application index for Quickshell Unified Menu
exec-once = ~/.local/bin/qs-app-indexer

# 5. Launch the Single Long-Running Quickshell Desktop Host
# Hosts: Top Bar, Wallpaper, Unified Menu, App Launcher, Clipboard Overlay,
#        Audio/Network/Bluetooth/Monitor/Power/Calendar Panels, Notification Server,
#        Volume/Brightness OSD, Keybind Cheat Sheet, and Session Lock!
exec-once = quickshell -n -p ~/.config/quickshell || quickshell -c ~/.config/quickshell
